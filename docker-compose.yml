# DEV: edit files, the browser reloads by itself.
#   docker compose up      ->  http://localhost:5173
services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    volumes: [".:/app", "node_modules:/app/node_modules"]
volumes:
  node_modules: {}
